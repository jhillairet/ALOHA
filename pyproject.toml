[project]
name = "aloha"
version = "0.1.0"
description = "ALOHA - Advanced LOwer Hybrid Antenna"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LICENSE" }
authors = [
    {name = "Julien Hillairet"}
]
keywords = ["plasma", "antenna", "lower hybrid", "wave coupling"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "h5py>=3.0",
    "tomli>=1.0",
    "scikit-rf>=2.1.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "prek>=0.5.5",
    "pytest-timeout>=2.4.0",
    "coverage>=7.16.2",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
# larger line length for rule E501 (default is 88)
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["B", "E", "F", "FA", "I", "NPY", "T", "UP", "W"]
ignore = ["F401", "F841", "B904", "B005", "T201", "E722", "E501"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "site-packages",
    "venv",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = [
    "src", "doc"
]
# warning: coverage makes PyCharm not stop at breakpoints
addopts = "--ignore-glob='*.ipynb_checkpoints'"
